<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OnTrack — A beautiful task manager to stay on top of your daily goals and track progress with an intuitive calendar view.">
  <title>OnTrack — Your Daily Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mid-blob"></div>
  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-top">
        <div class="greeting-section">
          <h1 class="greeting" id="greeting-text">Hello, Dara</h1>
          <p class="date-display" id="date-display"></p>
        </div>
        <div class="streak-badge" id="streak-badge">
          <span class="streak-fire">🔥</span>
          <span class="streak-count" id="streak-count">0</span>
          <span class="streak-label">day streak</span>
        </div>
      </div>
    </header>

    <!-- Calendar Section -->
    <section class="calendar-section" id="calendar-section">
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="cal-nav-btn" id="cal-prev" aria-label="Previous Month">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <h3 class="cal-month-year" id="cal-month-year"></h3>
          <button class="cal-nav-btn" id="cal-next" aria-label="Next Month">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
        <div class="calendar-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <div class="calendar-legend">
          <span class="legend-item"><span class="legend-dot has-tasks"></span> Has tasks</span>
          <span class="legend-item"><span class="legend-dot all-done"></span> All done</span>
        </div>
      </div>
    </section>

    <!-- Tasks Section -->
    <section class="tasks-section">
      <div class="tasks-header">
        <h2 class="tasks-title">Tasks</h2>
        <div class="tasks-counts">
          <span class="count-badge total-badge" id="total-count">0 total</span>
          <span class="count-badge done-badge" id="done-count">0 done</span>
        </div>
      </div>

      <!-- Task List -->
      <div class="task-list-container">
        <div class="task-list" id="task-list">
          <!-- Tasks rendered here -->
        </div>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <p class="empty-title">No tasks yet</p>
          <p class="empty-subtitle">Tap the + button to add your first task</p>
        </div>
        <div class="tomorrow-preview" id="tomorrow-preview"></div>
        <div class="upcoming-view" id="upcoming-view"></div>
      </div>
    </section>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-card" id="modal-card">
        <div class="modal-header">
          <h3><span id="modal-title">New Task</span></h3>
          <button class="modal-close" id="modal-close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            class="task-input"
            id="task-input"
            placeholder="What do you need to do?"
            maxlength="120"
            autocomplete="off"
          />
          <label class="date-label" for="task-date">Date</label>
          <input type="date" class="task-date-input" id="task-date" />
          <label class="date-label" style="margin-top:14px">Priority</label>
          <div class="priority-selector">
            <button class="priority-btn priority-high" data-priority="high">
              <span class="priority-btn-dot"></span> High
            </button>
            <button class="priority-btn priority-medium active" data-priority="medium">
              <span class="priority-btn-dot"></span> Medium
            </button>
            <button class="priority-btn priority-low" data-priority="low">
              <span class="priority-btn-dot"></span> Low
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" id="btn-cancel">Cancel</button>
          <button class="btn-add" id="btn-add">Add Task</button>
        </div>
      </div>
    </div>

    <!-- Upcoming Tasks Popup -->
    <div class="popup-overlay" id="popup-overlay">
      <div class="popup-card">
        <div class="popup-header">
          <h3 class="popup-title">Upcoming Tasks</h3>
          <button class="popup-close" id="popup-close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="popup-body" id="popup-body"></div>
        <div class="popup-footer">
          <button class="btn-got-it" id="btn-got-it">Got it!</button>
        </div>
      </div>
    </div>

    <!-- App branding -->
    <footer class="app-footer">
      <span class="brand">OnTrack</span>
    </footer>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item active" data-action="today" aria-label="Today">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span class="nav-label">Today</span>
        </button>
        <button class="nav-item" data-action="calendar" aria-label="Calendar">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span class="nav-label">Calendar</span>
        </button>
        <button class="nav-item nav-add-item" data-action="add" aria-label="Add task">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="nav-item" data-action="upcoming" aria-label="Upcoming">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="nav-label">Upcoming</span>
        </button>
      </div>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
